<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Family HQ — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7fb;
        --card: #ffffff;
        --line: #e2e2ee;
        --ink: #26263a;
        --muted: #6b6b85;
        --accent: #6c4ce0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191a20;
          --card: #23242c;
          --line: #383a45;
          --ink: #eff0f4;
          --muted: #a9abb8;
          --accent: #9b83f0;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 24rem;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 { font-size: 1.25rem; margin: 0.75rem 0 0.5rem; }
      p { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.925rem; }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 0.7rem;
        padding: 0.6rem 1.1rem;
        cursor: pointer;
      }
      .emoji { font-size: 2.5rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji" aria-hidden="true">🏡</div>
      <h1>No connection</h1>
      <p>
        Family HQ lives on your home server, so it needs to be able to reach it. Check the Wi-Fi, or
        try again in a moment.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
