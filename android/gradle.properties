org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Things you must change before publishing
# ---------------------------------------------------------------------------

# The package name Google Play will know this app by, forever — it cannot be
# changed after your first upload. Use a domain you actually control. The
# release build refuses to run while this still says "example".
familyhq.applicationId=com.example.familyhq

# The host your server is reachable at, e.g. family.example.com or
# yourmachine.your-tailnet.ts.net. Setting this, and serving the matching
# /.well-known/assetlinks.json, is what makes the app open fullscreen with no
# address bar. Leave it blank and the app will ask on first run and fall back
# to a Custom Tab, which shows the address bar.
familyhq.host=
